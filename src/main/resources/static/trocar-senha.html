<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trocar senha - Catequese Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="logo.png" />
</head>
<body>
  <div class="shell">
    <header id="header">
      <h1>Catequese Admin</h1>
      <img src="logo.png" alt="Logo Catequese" />
    </header>

    <div class="auth-layout">
      <section class="panel">
        <h2 id="titulo-troca">Trocar senha</h2>
        <div id="troca-aviso"></div>
        <form id="form-troca">
          <label>
            Senha atual
            <input id="senha-atual" type="password" autocomplete="current-password"
                   data-olho required />
          </label>
          <label>
            Nova senha
            <input id="senha-nova" type="password" autocomplete="new-password"
                   data-olho required />
          </label>
          <div class="criterios-senha" data-criterios-de="senha-nova"></div>
          <label>
            Repita a nova senha
            <input id="senha-repete" type="password" autocomplete="new-password"
                   data-olho data-confirma="senha-nova" required />
          </label>
          <div class="conferencia-senha" data-conferencia-de="senha-repete"></div>
          <button type="submit" id="btn-trocar">Salvar nova senha</button>
        </form>
        <div class="auth-rodape" id="rodape-troca">
          <a class="link-botao" href="index.html">Voltar ao início</a>
        </div>
      </section>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="senha-forte.js"></script>
  <script src="trocar-senha.js"></script>
</body>
</html>
