spring.application.name=catequeseapi

# MariaDB Desenvolvimento Local
# Use vari?veis de ambiente para evitar problemas com caracteres especiais
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/catequese?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catequese

# JWT
jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-before-production-minimum-64-characters-1234567890}
jwt.expirationMs=900000
jwt.refreshExpirationMs=604800000

# Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# Tomcat settings
server.tomcat.max-swallow-size=52428800
server.port=${PORT:8080}

gcs.bucket=catequese-escada-storage

# Frontend (monolito): usa o padrão do Spring em src/main/resources/static

