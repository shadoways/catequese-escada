spring.application.name=catequeseapi

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catequese
# JWT (troque por segredo forte em produção; preferível usar VAR de ambiente)
jwt.secret=${JWT_SECRET:}
jwt.expirationMs=172800000

# Upload limits
# máximo por arquivo (ex.: 20MB)
spring.servlet.multipart.max-file-size=20MB
# máximo por requisição (soma de todos os arquivos/form parts)
spring.servlet.multipart.max-request-size=40MB

# Tomcat settings (em bytes, -1 desliga limite)
# server.tomcat.max-swallow-size=-1
# Se preferir colocar um limite em bytes (ex.: 50MB):
server.tomcat.max-swallow-size=52428800
server.port=${PORT:8080}

gcs.bucket=catequese-escada-storage

# ---------------------------------------------------------------------------
# Controle de acesso (Etapa 1)
# false = API aberta, como sempre foi. O login ja funciona e emite token,
#         mas nenhuma rota e bloqueada -- o frontend atual continua funcionando.
# true  = aplica as restricoes por tipo de usuario (SecurityConfig).
#         So ligue depois da tela de login (Etapa 2) e das telas por papel (Etapa 3).
app.security.enabled=${APP_SECURITY_ENABLED:false}

# Usuario administrador inicial. So e usado se tb_usuario estiver vazia.
# Depois de criado o admin, remova estas variaveis do ambiente.
admin.inicial.username=${ADMIN_INICIAL_USERNAME:admin}
admin.inicial.password=${ADMIN_INICIAL_PASSWORD:}
admin.inicial.nome=${ADMIN_INICIAL_NOME:Coordenador Paroquial}
admin.inicial.email=${ADMIN_INICIAL_EMAIL:}

# ---------------------------------------------------------------------------
# Envio de e-mail (recuperacao de senha). Sem SPRING_MAIL_HOST definido, o app
# sobe normalmente e apenas nao envia e-mail -- o reset pelo administrador
# continua funcionando como alternativa.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}

# Remetente que aparece para quem recebe.
app.email.remetente=${APP_EMAIL_REMETENTE:}

# Endereco publico da aplicacao. Usado para montar o link de redefinicao de
# senha enviado por e-mail. Em producao aponte para o dominio real.
app.url.base=${APP_URL_BASE:http://localhost:8080}

# APENAS PARA TESTE, antes de existir SMTP: escreve o link de redefinicao no
# log quando o e-mail nao pode ser enviado. Um link no log vale o mesmo que uma
# senha -- mantenha false em producao.
app.recuperacao.logar-link=${APP_RECUPERACAO_LOGAR_LINK:false}
