spring.application.name=catequeseapi

# MySQL Aiven Produ??o
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catequese

# JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:900000}
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# Tomcat settings
server.tomcat.max-swallow-size=52428800
server.port=${PORT:8080}

gcs.bucket=catequese-escada-storage

# Frontend (monolito): usa o padrão do Spring em src/main/resources/static

# Logging em produ??o
logging.level.root=INFO
logging.level.com.catequese=INFO

