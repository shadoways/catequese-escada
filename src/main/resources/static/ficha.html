<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ficha de Catequese</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="logo.png" />
</head>
<body>
  <div class="shell">
    <div class="ficha-barra" id="ficha-barra">
      <span class="muted" id="ficha-status">Carregando ficha...</span>
      <div class="row">
        <button type="button" class="secondary" id="btn-voltar">Voltar ao cadastro</button>
        <button type="button" id="btn-imprimir">Imprimir / Exportar PDF</button>
      </div>
    </div>

    <div id="fichas-container"></div>
  </div>

  <script src="ficha.js"></script>
</body>
</html>
