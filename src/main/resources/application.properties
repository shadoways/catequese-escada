spring.application.name=catequeseapi

# Configura??o padr?o - usar perfil espec?fico (dev ou prod)
# Para desenvolvimento: spring.profiles.active=dev
# Para produ??o: spring.profiles.active=prod

# JWT
jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-before-production-minimum-64-characters-1234567890}
jwt.expirationMs=172800000

# Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# Tomcat settings
server.tomcat.max-swallow-size=52428800
server.port=${PORT:8080}

gcs.bucket=catequese-escada-storage

# Frontend
spring.web.resources.static-locations=
spring.mvc.static-path-pattern=/public/**


