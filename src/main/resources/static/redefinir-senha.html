<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redefinir senha - Catequese Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="logo.png" />
</head>
<body>
  <div class="shell">
    <header id="header">
      <h1>Catequese Admin</h1>
      <img src="logo.png" alt="Logo Catequese" />
    </header>

    <div class="auth-layout">
      <section class="panel">
        <h2>Criar nova senha</h2>
        <div id="redefinir-aviso"></div>
        <p class="muted">
          A nova senha precisa ter pelo menos 8 caracteres, com ao menos uma letra
          e um número.
        </p>
        <form id="form-redefinir">
          <label>
            Nova senha
            <input id="nova-senha" type="password" autocomplete="new-password" required />
          </label>
          <label>
            Repita a nova senha
            <input id="repete-senha" type="password" autocomplete="new-password" required />
          </label>
          <button type="submit" id="btn-redefinir">Salvar nova senha</button>
        </form>
        <div class="auth-rodape">
          <a class="link-botao" href="login.html">Ir para o login</a>
        </div>
      </section>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="redefinir-senha.js"></script>
</body>
</html>
